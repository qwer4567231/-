<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      background: #1a1a1a;
      color: #fff;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    h2 { margin-bottom: 10px; color: #ff9d00; }

    .camera-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      aspect-ratio: 9 / 16;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 4px 15px rgba(0,0,0,.5);
    }

    video { display: none; }

    canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      position: absolute;
      inset: 0;
      background: #000;
    }

    .btn-group {
      margin-top: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      width: 100%;
      max-width: 420px;
    }

    button {
      flex: 1;
      min-width: 120px;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-shoot { background: #ff9d00; color: #000; }
    .btn-switch { background: #337ab7; color: #fff; }
    .btn-download { background: #00c853; color: #fff; display: none; }
    .btn-retry { background: #555; color: #fff; display: none; }
  </style>
</head>

<body>
  <h2>🎃 萬聖節 AI 魔法鏡 🎃</h2>

  <div class="camera-container" onclick="triggerAutoFocus()">
    <video id="video" playsinline></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <div class="btn-group">
    <button id="switchBtn" class="btn-switch" onclick="switchCamera()">🔄 切換鏡頭</button>
    <button id="shootBtn" class="btn-shoot" onclick="takePhoto()">📸 拍照</button>
    <button id="retryBtn" class="btn-retry" onclick="resetCamera()">🔄 重拍</button>
    <button id="downloadBtn" class="btn-download" onclick="downloadPhoto()">💾 保存照片</button>
  </div>

<script>
const videoElement = document.getElementById('video');
const canvasElement = document.getElementById('output_canvas');
const canvasCtx = canvasElement.getContext('2d');

const frameImage = new Image();
frameImage.src = 'frame.png';

// 重要：這張 PNG 中間臉部必須是透明的
const headgearImage = new Image();
headgearImage.src = 'bear.png'; // 直接放原始熊熊圖，不需要事先挖洞

// 不改圖片檔：載入後在程式中自動去黑底 + 挖臉洞
const processedHeadgear = document.createElement('canvas');
const processedCtx = processedHeadgear.getContext('2d', { willReadFrequently: true });
let headgearReady = false;

headgearImage.onload = () => {
  processedHeadgear.width = headgearImage.naturalWidth;
  processedHeadgear.height = headgearImage.naturalHeight;

  processedCtx.clearRect(0, 0, processedHeadgear.width, processedHeadgear.height);
  processedCtx.drawImage(processedHeadgear, 0, 0);

  // 1. 自動把近黑色背景變透明
  const imageData = processedCtx.getImageData(
    0, 0, processedHeadgear.width, processedHeadgear.height
  );
  const data = imageData.data;

  for (let i = 0; i < data.length; i += 4) {
    const r = data[i];
    const g = data[i + 1];
    const b = data[i + 2];

    // 黑底門檻，可依圖片調整 20~45
    if (Math.max(r, g, b) < 28) {
      data[i + 3] = 0;
    }
  }

  processedCtx.putImageData(imageData, 0, 0);

  // 2. 用程式動態把原本卡通臉挖掉
  // 以下全部用圖片比例，換解析度也能正常工作
  const W = processedHeadgear.width;
  const H = processedHeadgear.height;

  processedCtx.save();
  processedCtx.globalCompositeOperation = 'destination-out';

  processedCtx.beginPath();

  // 臉洞中心與大小
  // cx / cy：洞的位置
  // rx / ry：洞的寬高
  const cx = W * 0.50;
  const cy = H * 0.69;
  const rx = W * 0.30;
  const ry = H * 0.23;

  processedCtx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
  processedCtx.fill();

  processedCtx.restore();

  headgearReady = true;
};

const slogans = [
  "🎃 不給發票就搗蛋！",
  "👻 雲端發票 萬聖神奇！",
  "🍬 載具存發票 糖果滿滿拿",
  "🧙‍♀️ 租稅魔法 快樂過萬聖",
  "✨ 發票存雲端 中獎最靈驗"
];

let currentSlogan = slogans[Math.floor(Math.random() * slogans.length)];
let isPaused = false;
let camera = null;
let facingMode = 'user';

// 平滑追蹤
const SMOOTHING = 0.22;
const trackedFaces = [];

/*
  bear_headgear_cutout_v2.png 的「透明臉洞中心」
  以整張圖片寬高比例表示。
  這是依目前熊頭套 PNG 校正的值。
*/
const HEADGEAR_ANCHOR_X = 0.50;
const HEADGEAR_ANCHOR_Y = 0.66;

// 頭套整體寬度 = 人臉寬度 × 此倍率
const HEADGEAR_SCALE = 1.90;

// 頭套上下微調：正值往下、負值往上
const HEADGEAR_OFFSET_Y = -0.02;

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function smoothAngle(current, target, amount) {
  let diff = target - current;
  while (diff > Math.PI) diff -= Math.PI * 2;
  while (diff < -Math.PI) diff += Math.PI * 2;
  return current + diff * amount;
}

function drawHeadgear(landmarks, index) {
  if (!headgearReady) return;

  // MediaPipe FaceMesh：
  // 234 = 左側臉頰/太陽穴外側
  // 454 = 右側臉頰/太陽穴外側
  // 10  = 額頭上方
  // 152 = 下巴底部
  const left = landmarks[234];
  const right = landmarks[454];
  const forehead = landmarks[10];
  const chin = landmarks[152];

  const lx = left.x * canvasElement.width;
  const ly = left.y * canvasElement.height;
  const rx = right.x * canvasElement.width;
  const ry = right.y * canvasElement.height;

  const fx = forehead.x * canvasElement.width;
  const fy = forehead.y * canvasElement.height;
  const cx = chin.x * canvasElement.width;
  const cy = chin.y * canvasElement.height;

  const faceWidth = Math.hypot(rx - lx, ry - ly);
  const faceHeight = Math.hypot(cx - fx, cy - fy);

  // 臉部中心：額頭到下巴的中間
  const targetX = (fx + cx) * 0.5;
  const targetY = (fy + cy) * 0.5 + faceHeight * HEADGEAR_OFFSET_Y;

  // 臉的左右傾斜角
  const targetAngle = Math.atan2(ry - ly, rx - lx);

  // 頭套尺寸
  const drawW = faceWidth * HEADGEAR_SCALE;
  const drawH = drawW * (processedHeadgear.height / processedHeadgear.width);

  if (!trackedFaces[index]) {
    trackedFaces[index] = {
      x: targetX,
      y: targetY,
      w: drawW,
      h: drawH,
      angle: targetAngle
    };
  }

  const t = trackedFaces[index];
  t.x = lerp(t.x, targetX, SMOOTHING);
  t.y = lerp(t.y, targetY, SMOOTHING);
  t.w = lerp(t.w, drawW, SMOOTHING);
  t.h = lerp(t.h, drawH, SMOOTHING);
  t.angle = smoothAngle(t.angle, targetAngle, SMOOTHING);

  canvasCtx.save();

  // 以「透明臉洞中心」對準真人臉中心
  canvasCtx.translate(t.x, t.y);
  canvasCtx.rotate(t.angle);

  canvasCtx.drawImage(
    processedHeadgear,
    -t.w * HEADGEAR_ANCHOR_X,
    -t.h * HEADGEAR_ANCHOR_Y,
    t.w,
    t.h
  );

  canvasCtx.restore();
}

function onResults(results) {
  if (isPaused) return;

  const w = videoElement.videoWidth || 720;
  const h = videoElement.videoHeight || 1280;

  if (canvasElement.width !== w) canvasElement.width = w;
  if (canvasElement.height !== h) canvasElement.height = h;

  canvasCtx.save();
  canvasCtx.clearRect(0, 0, w, h);

  // 自拍鏡頭顯示鏡像
  if (facingMode === 'user') {
    canvasCtx.translate(w, 0);
    canvasCtx.scale(-1, 1);
  }

  // 1. 鏡頭影像
  canvasCtx.drawImage(results.image, 0, 0, w, h);

  // 2. 人臉辨識後套上熊頭套
  if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
    results.multiFaceLandmarks.forEach((landmarks, index) => {
      drawHeadgear(landmarks, index);
    });

    // 移除多餘追蹤資料
    trackedFaces.length = results.multiFaceLandmarks.length;
  } else {
    trackedFaces.length = 0;
  }

  canvasCtx.restore();

  // 3. 相框不跟著鏡像
  if (frameImage.complete && frameImage.naturalWidth !== 0) {
    canvasCtx.drawImage(frameImage, 0, 0, w, h);
  }

  // 4. 標語
  if (currentSlogan) {
    canvasCtx.save();
    canvasCtx.font = `bold ${w * 0.07}px sans-serif`;
    canvasCtx.fillStyle = "#5d2800";
    canvasCtx.textAlign = "center";
    canvasCtx.textBaseline = "middle";
    canvasCtx.fillText(currentSlogan, w * 0.5, h * 0.060);
    canvasCtx.restore();
  }
}

const faceMesh = new FaceMesh({
  locateFile: file =>
    `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
  maxNumFaces: 3,
  refineLandmarks: true,
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.6
});

faceMesh.onResults(onResults);

function startCameraMode(mode) {
  if (camera) camera.stop();

  trackedFaces.length = 0;

  camera = new Camera(videoElement, {
    onFrame: async () => {
      if (!isPaused && videoElement.readyState >= 2) {
        await faceMesh.send({ image: videoElement });
      }
    },
    facingMode: mode,
    width: 1280,
    height: 720
  });

  camera.start().then(() => {
    setTimeout(triggerAutoFocus, 800);
  });
}

function triggerAutoFocus() {
  if (!videoElement.srcObject) return;

  const track = videoElement.srcObject.getVideoTracks()[0];
  if (!track || typeof track.getCapabilities !== 'function') return;

  const capabilities = track.getCapabilities();

  if (capabilities.focusMode?.includes('continuous')) {
    track.applyConstraints({
      advanced: [{ focusMode: 'continuous' }]
    }).catch(() => {});
  }
}

function switchCamera() {
  facingMode = facingMode === 'user' ? 'environment' : 'user';
  startCameraMode(facingMode);
}

function takePhoto() {
  isPaused = true;
  document.getElementById('shootBtn').style.display = 'none';
  document.getElementById('switchBtn').style.display = 'none';
  document.getElementById('retryBtn').style.display = 'block';
  document.getElementById('downloadBtn').style.display = 'block';
}

function resetCamera() {
  currentSlogan = slogans[Math.floor(Math.random() * slogans.length)];
  trackedFaces.length = 0;
  isPaused = false;

  document.getElementById('shootBtn').style.display = 'block';
  document.getElementById('switchBtn').style.display = 'block';
  document.getElementById('retryBtn').style.display = 'none';
  document.getElementById('downloadBtn').style.display = 'none';
}

function downloadPhoto() {
  const link = document.createElement('a');
  link.download = '萬聖節熊熊頭套合照.png';
  link.href = canvasElement.toDataURL('image/png');
  link.click();
}

startCameraMode(facingMode);
</script>
</body>
</html>
