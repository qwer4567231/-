<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>萬聖節 AI 魔法鏡</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #1a1a1a; color: #fff; text-align: center; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; }
    h2 { margin-bottom: 10px; color: #ff9d00; }
    
    /* 設定 9:16 直式黃金比例外框 */
    .camera-container { 
      position: relative; 
      width: 100%; 
      max-width: 360px; 
      aspect-ratio: 9/16; 
      border-radius: 16px; 
      overflow: hidden; 
      background: #000; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
    }
    
    video, canvas { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      position: absolute; 
      top: 0; 
      left: 0; 
    }
    
    /* 雄哥貼紙固定放在左下角 (left: 10px, bottom: 10px) */
    .sticker-overlay { 
      position: absolute; 
      bottom: 10px; 
      left: 10px; 
      width: 45%; 
      pointer-events: none; 
      z-index: 10; 
    }
    
    .btn-group { margin-top: 15px; display: flex; gap: 10px; width: 100%; max-width: 360px; }
    button { flex: 1; padding: 14px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .btn-shoot { background: #ff9d00; color: #000; }
    .btn-download { background: #00c853; color: #fff; display: none; }
    .btn-retry { background: #555; color: #fff; display: none; }
  </style>
</head>
<body>

  <h2>🎃 萬聖節 AI 魔法鏡 🎃</h2>

  <div class="camera-container">
    <video id="video" autoplay playsinline></video>
    <img id="sticker" class="sticker-overlay" src="xiong_ge.png" alt="雄哥貼紙">
    <canvas id="canvas" style="display: none;"></canvas>
  </div>

  <div class="btn-group">
    <button id="shootBtn" class="btn-shoot" onclick="takePhoto()">📸 拍照</button>
    <button id="retryBtn" class="btn-retry" onclick="resetCamera()">🔄 重拍</button>
    <button id="downloadBtn" class="btn-download" onclick="downloadPhoto()">💾 保存照片</button>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const sticker = document.getElementById('sticker');
    const shootBtn = document.getElementById('shootBtn');
    const retryBtn = document.getElementById('retryBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    // 啟動手機前鏡頭（優先調用高畫質直式比例）
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'user', width: { ideal: 1080 }, height: { ideal: 1920 } }, 
          audio: false 
        });
        video.srcObject = stream;
      } catch (err) {
        alert("無法讀取鏡頭，請確認是否已給予相機存取權限！");
      }
    }

    // 拍照並合成直式 9:16 (16:9) 照片
    function takePhoto() {
      const ctx = canvas.getContext('2d');
      
      // 強制輸出解析度為 1080x1920 (直式 16:9 / 9:16)
      canvas.width = 1080;
      canvas.height = 1920;

      // 計算畫面 Cover 裁切（避免影像變形拉伸）
      const vWidth = video.videoWidth || 1080;
      const vHeight = video.videoHeight || 1920;
      const videoAspect = vWidth / vHeight;
      const canvasAspect = canvas.width / canvas.height;

      let sx, sy, sWidth, sHeight;
      if (videoAspect > canvasAspect) {
        sHeight = vHeight;
        sWidth = vHeight * canvasAspect;
        sx = (vWidth - sWidth) / 2;
        sy = 0;
      } else {
        sWidth = vWidth;
        sHeight = vWidth / canvasAspect;
        sx = 0;
        sy = (vHeight - sHeight) / 2;
      }

      // 1. 繪製相機畫面（滿版不拉伸）
      ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, canvas.width, canvas.height);

      // 2. 計算左下角雄哥貼紙的大小與位置
      const stickerWidth = canvas.width * 0.45; // 寬度占畫面的 45%
      const stickerHeight = (sticker.naturalHeight / sticker.naturalWidth) * stickerWidth;
      
      const x = canvas.width * 0.03; // 靠左邊距離 3%
      const y = canvas.height - stickerHeight - (canvas.height * 0.02); // 靠下邊距離 2%

      // 3. 將雄哥貼紙繪製在左下角
      ctx.drawImage(sticker, x, y, stickerWidth, stickerHeight);

      // 切換視窗顯示
      video.style.display = 'none';
      sticker.style.display = 'none';
      canvas.style.display = 'block';

      shootBtn.style.display = 'none';
      retryBtn.style.display = 'block';
      downloadBtn.style.display = 'block';
    }

    // 重新拍照
    function resetCamera() {
      video.style.display = 'block';
      sticker.style.display = 'block';
      canvas.style.display = 'none';

      shootBtn.style.display = 'block';
      retryBtn.style.display = 'none';
      downloadBtn.style.display = 'none';
    }

    // 下載高畫質直式照片
    function downloadPhoto() {
      const link = document.createElement('a');
      link.download = '萬聖節雄哥合照.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    window.onload = initCamera;
  </script>
</body>
</html>
