<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>萬聖節 AI 魔法鏡</title>
  <!-- 引入 Google MediaPipe 官方套件 -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #1a1a1a; color: #fff; text-align: center; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; }
    h2 { margin-bottom: 10px; color: #ff9d00; }
    
    .camera-container { 
      position: relative; 
      width: 100%; 
      max-width: 420px; 
      aspect-ratio: 9/16; 
      border-radius: 16px; 
      overflow: hidden; 
      background: #000; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
    }
    
    video { display: none; }
    
    canvas { 
      width: 100%; 
      height: 100%; 
      object-fit: contain; 
      position: absolute; 
      top: 0; 
      left: 0; 
      background-color: #000;
    }
    
    .btn-group { margin-top: 15px; display: flex; gap: 10px; width: 100%; max-width: 420px; }
    button { flex: 1; padding: 14px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .btn-shoot { background: #ff9d00; color: #000; }
    .btn-download { background: #00c853; color: #fff; display: none; }
    .btn-retry { background: #555; color: #fff; display: none; }
  </style>
</head>
<body>

  <h2>🎃 萬聖節 AI 魔法鏡 🎃</h2>

  <div class="camera-container">
    <video id="video" playsinline></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <div class="btn-group">
    <button id="shootBtn" class="btn-shoot" onclick="takePhoto()">📸 拍照</button>
    <button id="retryBtn" class="btn-retry" onclick="resetCamera()">🔄 重拍（換特效）</button>
    <button id="downloadBtn" class="btn-download" onclick="downloadPhoto()">💾 保存照片</button>
  </div>

  <script>
    const videoElement = document.getElementById('video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');

    // 預先載入相框圖片
    const frameImage = new Image();
    frameImage.src = 'frame.png';

    // 特效圖片清單
    const effectSources = [
      'bat.png',
      'pumpkin.png',
      'ghost.png',
      'witch_hat.png',
      'candy.png'
    ];

    // 頂部隨機標語清單
    const slogans = [
      "🎃 不給發票就搗蛋！",
      "👻 雲端發票 萬聖神奇！",
      "🍬 載具存發票 糖果滿滿拿",
      "🧙‍♀️ 租稅魔法 快樂過萬聖",
      "✨ 發票存雲端 中獎最靈驗"
    ];

    let currentDecor = new Image();
    let currentDecorFileName = '';
    let currentSlogan = '';

    // 隨機切換特效圖案與標語
    function setRandomEffectAndSlogan() {
      const randomEffectIndex = Math.floor(Math.random() * effectSources.length);
      currentDecorFileName = effectSources[randomEffectIndex];
      currentDecor.src = currentDecorFileName;

      const randomSloganIndex = Math.floor(Math.random() * slogans.length);
      currentSlogan = slogans[randomSloganIndex];
    }

    setRandomEffectAndSlogan();

    let isPaused = false;
    let camera = null;

    // 平滑座標歷史紀錄（防抖動）
    const prevPositions = [];
    const SMOOTHING = 0.4;

    function onResults(results) {
      if (isPaused) return;

      canvasElement.width = videoElement.videoWidth || 720;
      canvasElement.height = videoElement.videoHeight || 1280;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      // 水平翻轉畫布（校正前鏡頭視角）
      canvasCtx.translate(canvasElement.width, 0);
      canvasCtx.scale(-1, 1);

      // -------------------------------------------------------------
      // ✨ 美顏與濾鏡設定（僅套用於鏡頭畫面，不影響相框與貼紙）
      // 1. blur(0.8px): 微柔膚，磨平細節
      // 2. brightness(108%): 提亮膚色
      // 3. contrast(102%): 補回對比度，保持立體感
      // 4. saturate(110%): 讓氣色看起來更紅潤
      // -------------------------------------------------------------
      canvasCtx.filter = 'blur(10.0px) brightness(106%) contrast(108%) saturate(108%)';

      // 1. 繪製鏡頭視角（已帶有美顏濾鏡）
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      // 繪製完人臉後重置濾鏡，確保貼紙、相框與文字清晰不模糊
      canvasCtx.filter = 'none';

      // 2. 人臉辨識與特效貼圖（使用左臉 187，右臉 411）
      if (results.multiFaceLandmarks && currentDecor.complete && currentDecor.naturalWidth !== 0) {
        let baseScale = 0.08;
        if (currentDecorFileName === 'bat.png') {
          baseScale = 0.12;
        }

        const FIX_WIDTH = canvasElement.width * baseScale; 
        const FIX_HEIGHT = (currentDecor.naturalHeight / currentDecor.naturalWidth) * FIX_WIDTH;

        results.multiFaceLandmarks.forEach((landmarks, index) => {
          const leftTargetX = landmarks[187].x * canvasElement.width;
          const leftTargetY = landmarks[187].y * canvasElement.height;
          const rightTargetX = landmarks[411].x * canvasElement.width;
          const rightTargetY = landmarks[411].y * canvasElement.height;

          const dx = rightTargetX - leftTargetX;
          const dy = rightTargetY - leftTargetY;
          const targetAngle = Math.atan2(dy, dx);

          if (!prevPositions[index]) {
            prevPositions[index] = { 
              lx: leftTargetX, ly: leftTargetY, 
              rx: rightTargetX, ry: rightTargetY,
              angle: targetAngle
            };
          }

          prevPositions[index].lx += (leftTargetX - prevPositions[index].lx) * SMOOTHING;
          prevPositions[index].ly += (leftTargetY - prevPositions[index].ly) * SMOOTHING;
          prevPositions[index].rx += (rightTargetX - prevPositions[index].rx) * SMOOTHING;
          prevPositions[index].ry += (rightTargetY - prevPositions[index].ry) * SMOOTHING;
          prevPositions[index].angle += (targetAngle - prevPositions[index].angle) * SMOOTHING;

          const p = prevPositions[index];

          // 繪製左臉貼紙
          canvasCtx.save();
          canvasCtx.translate(p.lx, p.ly);
          canvasCtx.rotate(p.angle);
          canvasCtx.drawImage(currentDecor, -FIX_WIDTH / 2, -FIX_HEIGHT / 2, FIX_WIDTH, FIX_HEIGHT);
          canvasCtx.restore();

          // 繪製右臉貼紙
          canvasCtx.save();
          canvasCtx.translate(p.rx, p.ry);
          canvasCtx.rotate(p.angle);
          canvasCtx.drawImage(currentDecor, -FIX_WIDTH / 2, -FIX_HEIGHT / 2, FIX_WIDTH, FIX_HEIGHT);
          canvasCtx.restore();
        });
      } else {
        prevPositions.length = 0;
      }

      // 恢復畫布正向（讓相框和文字維持正向顯示）
      canvasCtx.restore();

      // 3. 繪製相框
      if (frameImage.complete && frameImage.naturalWidth !== 0) {
        canvasCtx.drawImage(frameImage, 0, 0, canvasElement.width, canvasElement.height);
      }

      // 4. 繪製頂部隨機標語文字（大字體 + 位置下移）
      if (currentSlogan) {
        canvasCtx.save();
        canvasCtx.font = "bold " + (canvasElement.width * 0.070) + "px sans-serif";
        canvasCtx.fillStyle = "#5d2800";
        canvasCtx.textAlign = "center";
        canvasCtx.textBaseline = "middle";
        canvasCtx.fillText(currentSlogan, canvasElement.width * 0.5, canvasElement.height * 0.060);
        canvasCtx.restore();
      }
    }

    // 初始化人臉追蹤
    const faceMesh = new FaceMesh({locateFile: (file) => {
      return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
    }});
    faceMesh.setOptions({
      maxNumFaces: 3,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    faceMesh.onResults(onResults);

    // 啟動鏡頭
    camera = new Camera(videoElement, {
      onFrame: async () => {
        if (!isPaused) await faceMesh.send({image: videoElement});
      },
      width: 1280,
      height: 720
    });
    camera.start();

    // 拍照按鈕
    function takePhoto() {
      isPaused = true;

      document.getElementById('shootBtn').style.display = 'none';
      document.getElementById('retryBtn').style.display = 'block';
      document.getElementById('downloadBtn').style.display = 'block';
    }

    // 重拍按鈕
    function resetCamera() {
      setRandomEffectAndSlogan();
      prevPositions.length = 0;
      isPaused = false;
      document.getElementById('shootBtn').style.display = 'block';
      document.getElementById('retryBtn').style.display = 'none';
      document.getElementById('downloadBtn').style.display = 'none';
    }

    // 保存照片
    function downloadPhoto() {
      const link = document.createElement('a');
      link.download = '萬聖節變身合照.png';
      link.href = canvasElement.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
