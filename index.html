<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>萬聖節 AI 魔法鏡</title>
  <!-- 引入 Google MediaPipe 官方套件 -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #1a1a1a; color: #fff; text-align: center; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; }
    h2 { margin-bottom: 10px; color: #ff9d00; }
    
    .camera-container { 
      position: relative; 
      width: 100%; 
      max-width: 420px; 
      aspect-ratio: 9/16; 
      border-radius: 16px; 
      overflow: hidden; 
      background: #000; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
    }
    
    video { display: none; }
    
    canvas { 
      width: 100%; 
      height: 100%; 
      object-fit: contain; 
      position: absolute; 
      top: 0; 
      left: 0; 
      background-color: #000;
    }
    
    .btn-group { margin-top: 15px; display: flex; flex-wrap: wrap; gap: 10px; width: 100%; max-width: 420px; }
    button { flex: 1; min-width: 120px; padding: 14px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .btn-shoot { background: #ff9d00; color: #000; }
    .btn-switch { background: #337ab7; color: #fff; }
    .btn-download { background: #00c853; color: #fff; display: none; }
    .btn-retry { background: #555; color: #fff; display: none; }
  </style>
</head>
<body>

  <h2>🎃 萬聖節 AI 魔法鏡 🎃</h2>

  <div class="camera-container" onclick="triggerAutoFocus()">
    <video id="video" playsinline></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <div class="btn-group">
    <button id="switchBtn" class="btn-switch" onclick="switchCamera()">🔄 切換鏡頭</button>
    <button id="shootBtn" class="btn-shoot" onclick="takePhoto()">📸 拍照</button>
    <button id="retryBtn" class="btn-retry" onclick="resetCamera()">🔄 重拍（換特效）</button>
    <button id="downloadBtn" class="btn-download" onclick="downloadPhoto()">💾 保存照片</button>
  </div>

  <script>
    const videoElement = document.getElementById('video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');

    const frameImage = new Image();
    frameImage.src = 'frame.png';

    const effectSources = [
      'bat.png',
      'pumpkin.png',
      'ghost.png',
      'witch_hat.png',
      'candy.png'
    ];

    const slogans = [
      "🎃 不給發票就搗蛋！",
      "👻 雲端發票 萬聖神奇！",
      "🍬 載具存發票 糖果滿滿拿",
      "🧙‍♀️ 租稅魔法 快樂過萬聖",
      "✨ 發票存雲端 中獎最靈驗"
    ];

    let currentDecor = new Image();
    let currentDecorFileName = '';
    let currentSlogan = '';

    function setRandomEffectAndSlogan() {
      const randomEffectIndex = Math.floor(Math.random() * effectSources.length);
      currentDecorFileName = effectSources[randomEffectIndex];
      currentDecor.src = currentDecorFileName;

      const randomSloganIndex = Math.floor(Math.random() * slogans.length);
      currentSlogan = slogans[randomSloganIndex];
    }

    setRandomEffectAndSlogan();

    let isPaused = false;
    let camera = null;
    let facingMode = 'user';

    const prevPositions = [];
    const SMOOTHING = 0.15;

    function onResults(results) {
      if (isPaused) return;

      // 💡 限制 DPR 最高為 2，確保跨平台穩定不閃退，同時保持高畫質
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const displayWidth = videoElement.videoWidth || 1280;
      const displayHeight = videoElement.videoHeight || 720;

      canvasElement.width = displayWidth * dpr;
      canvasElement.height = displayHeight * dpr;

      canvasCtx.save();
      canvasCtx.scale(dpr, dpr);

      const canvasW = displayWidth;
      const canvasH = displayHeight;

      canvasCtx.clearRect(0, 0, canvasW, canvasH);

      if (facingMode === 'user') {
        canvasCtx.translate(canvasW, 0);
        canvasCtx.scale(-1, 1);
      }

      // 1. 繪製鏡頭畫面
      canvasCtx.drawImage(results.image, 0, 0, canvasW, canvasH);

      // 2. 人臉辨識與特效貼圖
      if (results.multiFaceLandmarks && currentDecor.complete && currentDecor.naturalWidth !== 0) {
        let baseScale = 0.08;
        if (currentDecorFileName === 'bat.png') {
          baseScale = 0.12;
        }

        const FIX_WIDTH = canvasW * baseScale; 
        const FIX_HEIGHT = (currentDecor.naturalHeight / currentDecor.naturalWidth) * FIX_WIDTH;

        results.multiFaceLandmarks.forEach((landmarks, index) => {
          const leftTargetX = landmarks[187].x * canvasW;
          const leftTargetY = landmarks[187].y * canvasH;
          const rightTargetX = landmarks[411].x * canvasW;
          const rightTargetY = landmarks[411].y * canvasH;

          const dx = rightTargetX - leftTargetX;
          const dy = rightTargetY - leftTargetY;
          const targetAngle = Math.atan2(dy, dx);

          if (!prevPositions[index]) {
            prevPositions[index] = { 
              lx: leftTargetX, ly: leftTargetY, 
              rx: rightTargetX, ry: rightTargetY,
              angle: targetAngle
            };
          }

          const p = prevPositions[index];

          p.lx += (leftTargetX - p.lx) * SMOOTHING;
          p.ly += (leftTargetY - p.ly) * SMOOTHING;
          p.rx += (rightTargetX - p.rx) * SMOOTHING;
          p.ry += (rightTargetY - p.ry) * SMOOTHING;

          let diffAngle = targetAngle - p.angle;
          while (diffAngle < -Math.PI) diffAngle += Math.PI * 2;
          while (diffAngle > Math.PI) diffAngle -= Math.PI * 2;
          p.angle += diffAngle * (SMOOTHING * 0.8);

          // 左臉貼紙
          canvasCtx.save();
          canvasCtx.translate(p.lx, p.ly);
          canvasCtx.rotate(p.angle);
          canvasCtx.drawImage(currentDecor, -FIX_WIDTH / 2, -FIX_HEIGHT / 2, FIX_WIDTH, FIX_HEIGHT);
          canvasCtx.restore();

          // 右臉貼紙
          canvasCtx.save();
          canvasCtx.translate(p.rx, p.ry);
          canvasCtx.rotate(p.angle);
          canvasCtx.drawImage(currentDecor, -FIX_WIDTH / 2, -FIX_HEIGHT / 2, FIX_WIDTH, FIX_HEIGHT);
          canvasCtx.restore();
        });
      } else {
        prevPositions.length = 0;
      }

      canvasCtx.restore();

      // 3. 繪製相框
      if (frameImage.complete && frameImage.naturalWidth !== 0) {
        canvasCtx.drawImage(frameImage, 0, 0, canvasW, canvasH);
      }

      // 4. 繪製標語
      if (currentSlogan) {
        canvasCtx.save();
        canvasCtx.font = "bold " + (canvasW * 0.070) + "px sans-serif";
        canvasCtx.fillStyle = "#5d2800";
        canvasCtx.textAlign = "center";
        canvasCtx.textBaseline = "middle";
        canvasCtx.fillText(currentSlogan, canvasW * 0.5, canvasH * 0.060);
        canvasCtx.restore();
      }
    }

    const faceMesh = new FaceMesh({locateFile: (file) => {
      return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
    }});
    faceMesh.setOptions({
      maxNumFaces: 3,
      refineLandmarks: true,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });
    faceMesh.onResults(onResults);

    function startCameraMode(mode) {
      if (camera) {
        camera.stop();
      }
      prevPositions.length = 0;
      
      // 💡 採用 ideal 設定，高階機開 1080p，低階機自動降至支援解析度，防止黑屏
      camera = new Camera(videoElement, {
        onFrame: async () => {
          if (!isPaused) await faceMesh.send({image: videoElement});
        },
        facingMode: mode,
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      });
      
      camera.start().then(() => {
        setTimeout(() => {
          triggerAutoFocus();
        }, 800);
      }).catch(err => {
        console.error("Camera access error:", err);
      });
    }

    function triggerAutoFocus() {
      if (videoElement.srcObject) {
        const track = videoElement.srcObject.getVideoTracks()[0];
        if (track && typeof track.getCapabilities === 'function') {
          const capabilities = track.getCapabilities();
          if (capabilities.focusMode && capabilities.focusMode.includes('continuous')) {
            track.applyConstraints({
              advanced: [{ focusMode: 'continuous' }]
            }).catch(err => console.log('Focus warning:', err));
          }
        }
      }
    }

    startCameraMode(facingMode);

    function switchCamera() {
      facingMode = (facingMode === 'user') ? 'environment' : 'user';
      startCameraMode(facingMode);
    }

    function takePhoto() {
      isPaused = true;
      document.getElementById('shootBtn').style.display = 'none';
      document.getElementById('switchBtn').style.display = 'none';
      document.getElementById('retryBtn').style.display = 'block';
      document.getElementById('downloadBtn').style.display = 'block';
    }

    function resetCamera() {
      setRandomEffectAndSlogan();
      prevPositions.length = 0;
      isPaused = false;
      document.getElementById('shootBtn').style.display = 'block';
      document.getElementById('switchBtn').style.display = 'block';
      document.getElementById('retryBtn').style.display = 'none';
      document.getElementById('downloadBtn').style.display = 'none';
    }

    function downloadPhoto() {
      const link = document.createElement('a');
      link.download = '萬聖節變身合照.png';
      link.href = canvasElement.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
