<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>萬聖節 AI 魔法鏡</title>
  <!-- 引入 Google MediaPipe 官方套件 -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #1a1a1a; color: #fff; text-align: center; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; }
    h2 { margin-bottom: 10px; color: #ff9d00; }
    
    .camera-container { 
      position: relative; 
      width: 100%; 
      max-width: 420px; 
      aspect-ratio: 9/16; 
      border-radius: 16px; 
      overflow: hidden; 
      background: #000; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
    }
    
    video { display: none; }
    
    canvas { 
      width: 100%; 
      height: 100%; 
      object-fit: contain; 
      position: absolute; 
      top: 0; 
      left: 0; 
      background-color: #000;
    }

    /* 全畫面相框圖層 */
    .frame-overlay { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      pointer-events: none; 
      z-index: 10; 
      object-fit: fill;
    }

    /* 頂部隨機標語文字圖層 */
    .slogan-overlay {
      position: absolute;
      top: 2.8%;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      z-index: 20;
      pointer-events: none;
      font-size: 20px;
      font-weight: 900;
      color: #5d2800;
      text-align: center;
      letter-spacing: 1px;
      text-shadow: 0px 1px 1px rgba(255, 255, 255, 0.6);
    }
    
    .btn-group { margin-top: 15px; display: flex; gap: 10px; width: 100%; max-width: 420px; }
    button { flex: 1; padding: 14px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .btn-shoot { background: #ff9d00; color: #000; }
    .btn-download { background: #00c853; color: #fff; display: none; }
    .btn-retry { background: #555; color: #fff; display: none; }
  </style>
</head>
<body>

  <h2>🎃 萬聖節 AI 魔法鏡 🎃</h2>

  <div class="camera-container">
    <video id="video" playsinline></video>
    <canvas id="output_canvas"></canvas>
    <!-- 全畫面相框 -->
    <img id="frame_img" class="frame-overlay" src="frame.png" alt="萬聖節外框">
    <!-- 隨機標語文字顯示區 -->
    <div id="slogan_box" class="slogan-overlay"></div>
  </div>

  <div class="btn-group">
    <button id="shootBtn" class="btn-shoot" onclick="takePhoto()">📸 拍照</button>
    <button id="retryBtn" class="btn-retry" onclick="resetCamera()">🔄 重拍（換特效）</button>
    <button id="downloadBtn" class="btn-download" onclick="downloadPhoto()">💾 保存照片</button>
  </div>

  <script>
    const videoElement = document.getElementById('video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const frameImg = document.getElementById('frame_img');
    const sloganBox = document.getElementById('slogan_box');

    // 特效圖片清單
    const effectSources = [
      'bat.png',
      'pumpkin.png',
      'ghost.png',
      'witch_hat.png',
      'candy.png'
    ];

    // 頂部隨機標語清單
    const slogans = [
      "🎃 不給發票就搗蛋！",
      "👻 雲端發票 萬聖神奇！",
      "🍬 載具存發票 糖果滿滿拿",
      "🧙‍♀️ 租稅魔法 快樂過萬聖",
      "✨ 發票存雲端 中獎最靈驗"
    ];

    let currentDecor = new Image();
    let currentDecorFileName = '';
    let currentSlogan = '';

    // 隨機切換特效圖案與標語
    function setRandomEffectAndSlogan() {
      const randomEffectIndex = Math.floor(Math.random() * effectSources.length);
      currentDecorFileName = effectSources[randomEffectIndex];
      currentDecor.src = currentDecorFileName;

      const randomSloganIndex = Math.floor(Math.random() * slogans.length);
      currentSlogan = slogans[randomSloganIndex];
      sloganBox.innerText = currentSlogan;
    }

    setRandomEffectAndSlogan();

    let isPaused = false;
    let camera = null;

    // 平滑座標歷史紀錄（防抖動）
    const prevPositions = [];
    const SMOOTHING = 0.25;

    function onResults(results) {
      if (isPaused) return;

      canvasElement.width = videoElement.videoWidth || 720;
      canvasElement.height = videoElement.videoHeight || 1280;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      // 水平翻轉畫布
      canvasCtx.translate(canvasElement.width, 0);
      canvasCtx.scale(-1, 1);

      // 1. 繪製鏡頭視角
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      // 2. 人臉辨識與特效貼圖
      if (results.multiFaceLandmarks && currentDecor.complete && currentDecor.naturalWidth !== 0) {
        
        let baseScale = 0.08;
        if (currentDecorFileName === 'bat.png') {
          baseScale = 0.12;
        }

        const FIX_WIDTH = canvasElement.width * baseScale; 
        const FIX_HEIGHT = (currentDecor.naturalHeight / currentDecor.naturalWidth) * FIX_WIDTH;

        results.multiFaceLandmarks.forEach((landmarks, index) => {
          // 使用你調整好的節點：左臉 187，右臉 411
          const leftTargetX = landmarks[187].x * canvasElement.width;
          const leftTargetY = landmarks[187].y * canvasElement.height;
          const rightTargetX = landmarks[411].x * canvasElement.width;
          const rightTargetY = landmarks[411].y * canvasElement.height;

          if (!prevPositions[index]) {
            prevPositions[index] = { 
              lx: leftTargetX, ly: leftTargetY, 
              rx: rightTargetX, ry: rightTargetY 
            };
          }

          prevPositions[index].lx += (leftTargetX - prevPositions[index].lx) * SMOOTHING;
          prevPositions[index].ly += (leftTargetY - prevPositions[index].ly) * SMOOTHING;
          prevPositions[index].rx += (rightTargetX - prevPositions[index].rx) * SMOOTHING;
          prevPositions[index].ry += (rightTargetY - prevPositions[index].ry) * SMOOTHING;

          const p = prevPositions[index];

          canvasCtx.drawImage(currentDecor, p.lx - (FIX_WIDTH / 2), p.ly - (FIX_HEIGHT / 2), FIX_WIDTH, FIX_HEIGHT);
          canvasCtx.drawImage(currentDecor, p.rx - (FIX_WIDTH / 2), p.ry - (FIX_HEIGHT / 2), FIX_WIDTH, FIX_HEIGHT);
        });
      } else {
        prevPositions.length = 0;
      }

      canvasCtx.restore();
    }

    // 初始化人臉追蹤
    const faceMesh = new FaceMesh({locateFile: (file) => {
      return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
    }});
    faceMesh.setOptions({
      maxNumFaces: 3,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    faceMesh.onResults(onResults);

    // 啟動鏡頭
    camera = new Camera(videoElement, {
      onFrame: async () => {
        if (!isPaused) await faceMesh.send({image: videoElement});
      },
      width: 1280,
      height: 720
    });
    camera.start();

    // 拍照按鈕
    function takePhoto() {
      isPaused = true;

      // 1. 合成相框
      canvasCtx.drawImage(frameImg, 0, 0, canvasElement.width, canvasElement.height);

      // 2. 合成標語文字
      canvasCtx.save();
      canvasCtx.font = "bold " + (canvasElement.width * 1.0) + "px sans-serif";
      canvasCtx.fillStyle = "#5d2800";
      canvasCtx.textAlign = "center";
      canvasCtx.textBaseline = "middle";
      canvasCtx.fillText(currentSlogan, canvasElement.width * 0.5, canvasElement.height * 0.048);
      canvasCtx.restore();

      frameImg.style.display = 'none';
      sloganBox.style.display = 'none';

      document.getElementById('shootBtn').style.display = 'none';
      document.getElementById('retryBtn').style.display = 'block';
      document.getElementById('downloadBtn').style.display = 'block';
    }

    // 重拍按鈕
    function resetCamera() {
      setRandomEffectAndSlogan();
      prevPositions.length = 0;
      isPaused = false;
      frameImg.style.display = 'block';
      sloganBox.style.display = 'block';
      document.getElementById('shootBtn').style.display = 'block';
      document.getElementById('retryBtn').style.display = 'none';
      document.getElementById('downloadBtn').style.display = 'none';
    }

    // 保存照片
    function downloadPhoto() {
      const link = document.createElement('a');
      link.download = '萬聖節變身合照.png';
      link.href = canvasElement.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
