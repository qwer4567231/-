<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>萬聖節 AI 魔法鏡</title>
  <!-- 引入 Google MediaPipe 官方套件 -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #1a1a1a; color: #fff; text-align: center; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; }
    h2 { margin-bottom: 10px; color: #ff9d00; }
    
    .camera-container { 
      position: relative; 
      width: 100%; 
      max-width: 420px; 
      aspect-ratio: 9/16; 
      border-radius: 16px; 
      overflow: hidden; 
      background: #000; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
    }
    
    video { display: none; }
    
    canvas { 
      width: 100%; 
      height: 100%; 
      object-fit: contain; 
      position: absolute; 
      top: 0; 
      left: 0; 
      background-color: #000;
    }

    /* 萬聖節框框圖層：獨立覆蓋在最上層 */
    .frame-overlay { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      pointer-events: none; 
      z-index: 10; 
      object-fit: fill;
    }
    
    .btn-group { margin-top: 15px; display: flex; gap: 10px; width: 100%; max-width: 420px; }
    button { flex: 1; padding: 14px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .btn-shoot { background: #ff9d00; color: #000; }
    .btn-download { background: #00c853; color: #fff; display: none; }
    .btn-retry { background: #555; color: #fff; display: none; }
  </style>
</head>
<body>

  <h2>🎃 萬聖節 AI 魔法鏡 🎃</h2>

  <div class="camera-container">
    <video id="video" playsinline></video>
    <canvas id="output_canvas"></canvas>
    <!-- 全畫面相框 -->
    <img id="frame_img" class="frame-overlay" src="frame.png" alt="萬聖節外框">
  </div>

  <div class="btn-group">
    <button id="shootBtn" class="btn-shoot" onclick="takePhoto()">📸 拍照</button>
    <button id="retryBtn" class="btn-retry" onclick="resetCamera()">🔄 重拍（換特效）</button>
    <button id="downloadBtn" class="btn-download" onclick="downloadPhoto()">💾 保存照片</button>
  </div>

  <script>
    const videoElement = document.getElementById('video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const frameImg = document.getElementById('frame_img');

    // 1. 所有特效圖片清單
    const effectSources = [
      'bat.png',        // 蝙蝠
      'pumpkin.png',    // 南瓜
      'ghost.png',      // 鬼
      'witch_hat.png',  // 巫師帽
      'candy.png'       // 糖果
    ];

    // 當前抽中的特效圖片物件
    let currentDecor = new Image();

    // 隨機切換特效圖案
    function setRandomEffect() {
      const randomIndex = Math.floor(Math.random() * effectSources.length);
      currentDecor.src = effectSources[randomIndex];
    }

    // 頁面初始化時先隨機抽一張
    setRandomEffect();

    let isPaused = false;
    let camera = null;

    function onResults(results) {
      if (isPaused) return;

      canvasElement.width = videoElement.videoWidth || 720;
      canvasElement.height = videoElement.videoHeight || 1280;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      // 水平翻轉畫布，校正前置鏡頭預設視角
      canvasCtx.translate(canvasElement.width, 0);
      canvasCtx.scale(-1, 1);

      // 繪製鏡頭視角
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      // 人臉辨識：定位兩側臉頰貼上當前抽到的特效
      if (results.multiFaceLandmarks && currentDecor.complete && currentDecor.naturalWidth !== 0) {
        for (const landmarks of results.multiFaceLandmarks) {
          const leftCheekLower = landmarks[205];
          const rightCheekLower = landmarks[425];

          const leftEye = landmarks[33];
          const rightEye = landmarks[263];
          const eyeDistance = Math.hypot(
            (rightEye.x - leftEye.x) * canvasElement.width,
            (rightEye.y - leftEye.y) * canvasElement.height
          );

          const decorWidth = eyeDistance * 0.42;
          const decorHeight = (currentDecor.naturalHeight / currentDecor.naturalWidth) * decorWidth;

          // 左臉頰
          const leftX = leftCheekLower.x * canvasElement.width;
          const leftY = leftCheekLower.y * canvasElement.height;
          canvasCtx.drawImage(currentDecor, leftX - (decorWidth / 2), leftY - (decorHeight / 2), decorWidth, decorHeight);

          // 右臉頰
          const rightX = rightCheekLower.x * canvasElement.width;
          const rightY = rightCheekLower.y * canvasElement.height;
          canvasCtx.drawImage(currentDecor, rightX - (decorWidth / 2), rightY - (decorHeight / 2), decorWidth, decorHeight);
        }
      }

      canvasCtx.restore();
    }

    // 初始化人臉追蹤
    const faceMesh = new FaceMesh({locateFile: (file) => {
      return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
    }});
    faceMesh.setOptions({
      maxNumFaces: 3,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    faceMesh.onResults(onResults);

    // 啟動鏡頭
    camera = new Camera(videoElement, {
      onFrame: async () => {
        if (!isPaused) await faceMesh.send({image: videoElement});
      },
      width: 1280,
      height: 720
    });
    camera.start();

    // 拍照按鈕
    function takePhoto() {
      isPaused = true;

      // 在產圖當下，將方向正確的框框合成到 Canvas 最上層
      canvasCtx.drawImage(frameImg, 0, 0, canvasElement.width, canvasElement.height);

      // 隱藏 HTML 上的獨立框框圖層
      frameImg.style.display = 'none';

      document.getElementById('shootBtn').style.display = 'none';
      document.getElementById('retryBtn').style.display = 'block';
      document.getElementById('downloadBtn').style.display = 'block';
    }

    // 重拍按鈕：每次按下重拍，自動隨機換下一個臉部特效！
    function resetCamera() {
      setRandomEffect(); // 隨機更換特效
      isPaused = false;
      frameImg.style.display = 'block';
      document.getElementById('shootBtn').style.display = 'block';
      document.getElementById('retryBtn').style.display = 'none';
      document.getElementById('downloadBtn').style.display = 'none';
    }

    // 保存照片
    function downloadPhoto() {
      const link = document.createElement('a');
      link.download = '萬聖節變身合照.png';
      link.href = canvasElement.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
