<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>萬聖節 AI 魔法鏡</title>
  <!-- 引入 Google MediaPipe 官方套件 -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #1a1a1a; color: #fff; text-align: center; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; }
    h2 { margin-bottom: 10px; color: #ff9d00; }
    
    .camera-container { 
      position: relative; 
      width: 100%; 
      max-width: 420px; 
      aspect-ratio: 9/16; 
      border-radius: 16px; 
      overflow: hidden; 
      background: #000; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
    }
    
    video { display: none; }
    
    canvas { 
      width: 100%; 
      height: 100%; 
      object-fit: contain; 
      position: absolute; 
      top: 0; 
      left: 0; 
      background-color: #000;
    }

    /* 雄哥貼紙層：永遠獨立疊在左下角，完全不受 Canvas 翻轉影響 */
    .sticker-overlay { 
      position: absolute; 
      bottom: 12px; 
      left: 12px; 
      width: 35%; 
      pointer-events: none; 
      z-index: 10; 
    }
    
    .btn-group { margin-top: 15px; display: flex; gap: 10px; width: 100%; max-width: 420px; }
    button { flex: 1; padding: 14px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .btn-shoot { background: #ff9d00; color: #000; }
    .btn-download { background: #00c853; color: #fff; display: none; }
    .btn-retry { background: #555; color: #fff; display: none; }
  </style>
</head>
<body>

  <h2>🎃 萬聖節 AI 魔法鏡 🎃</h2>

  <div class="camera-container">
    <video id="video" playsinline></video>
    <canvas id="output_canvas"></canvas>
    <!-- 左下角固定萬聖節雄哥（透過 HTML/CSS 壓在最上層，方向絕對永遠正確） -->
    <img id="xiong_ge" class="sticker-overlay" src="xiong_ge.png" alt="雄哥貼紙">
  </div>

  <div class="btn-group">
    <button id="shootBtn" class="btn-shoot" onclick="takePhoto()">📸 拍照</button>
    <button id="retryBtn" class="btn-retry" onclick="resetCamera()">🔄 重拍</button>
    <button id="downloadBtn" class="btn-download" onclick="downloadPhoto()">💾 保存照片</button>
  </div>

  <!-- 臉部蝙蝠特效圖案 (單隻蝙蝠) -->
  <img id="bat_decor" src="bat.png" style="display:none;">

  <script>
    const videoElement = document.getElementById('video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const batDecor = document.getElementById('bat_decor');
    const xiongGe = document.getElementById('xiong_ge');

    let isPaused = false;
    let camera = null;

    function onResults(results) {
      if (isPaused) return;

      canvasElement.width = videoElement.videoWidth || 720;
      canvasElement.height = videoElement.videoHeight || 1280;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      // 水平翻轉畫布，校正前置鏡頭預設視角
      canvasCtx.translate(canvasElement.width, 0);
      canvasCtx.scale(-1, 1);

      // 1. 繪製鏡頭視角
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      // 2. 人臉辨識：定位兩側臉頰蝙蝠特效
      if (results.multiFaceLandmarks) {
        for (const landmarks of results.multiFaceLandmarks) {
          const leftCheekLower = landmarks[205];
          const rightCheekLower = landmarks[425];

          const leftEye = landmarks[33];
          const rightEye = landmarks[263];
          const eyeDistance = Math.hypot(
            (rightEye.x - leftEye.x) * canvasElement.width,
            (rightEye.y - leftEye.y) * canvasElement.height
          );

          const batWidth = eyeDistance * 0.42;
          const batHeight = (batDecor.naturalHeight / batDecor.naturalWidth) * batWidth;

          const leftX = leftCheekLower.x * canvasElement.width;
          const leftY = leftCheekLower.y * canvasElement.height;
          canvasCtx.drawImage(batDecor, leftX - (batWidth / 2), leftY - (batHeight / 2), batWidth, batHeight);

          const rightX = rightCheekLower.x * canvasElement.width;
          const rightY = rightCheekLower.y * canvasElement.height;
          canvasCtx.drawImage(batDecor, rightX - (batWidth / 2), rightY - (batHeight / 2), batWidth, batHeight);
        }
      }

      canvasCtx.restore();
    }

    // 初始化人臉追蹤
    const faceMesh = new FaceMesh({locateFile: (file) => {
      return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
    }});
    faceMesh.setOptions({
      maxNumFaces: 3,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    faceMesh.onResults(onResults);

    // 啟動鏡頭
    camera = new Camera(videoElement, {
      onFrame: async () => {
        if (!isPaused) await faceMesh.send({image: videoElement});
      },
      width: 1280,
      height: 720
    });
    camera.start();

    // 拍照：凍結 Canvas 並把雄哥貼紙合進 Canvas 輸出檔中
    function takePhoto() {
      isPaused = true;

      // 在產圖當下，把方向正確的雄哥貼紙合成進去
      const xiongWidth = canvasElement.width * 0.35;
      const xiongHeight = (xiongGe.naturalHeight / xiongGe.naturalWidth) * xiongWidth;
      
      canvasCtx.drawImage(
        xiongGe, 
        canvasElement.width * 0.03, 
        canvasElement.height - xiongHeight - (canvasElement.height * 0.02), 
        xiongWidth, 
        xiongHeight
      );

      // 隱藏獨立貼紙元件，避重疊
      xiongGe.style.display = 'none';

      document.getElementById('shootBtn').style.display = 'none';
      document.getElementById('retryBtn').style.display = 'block';
      document.getElementById('downloadBtn').style.display = 'block';
    }

    // 重拍：恢復即時預覽與獨立貼紙
    function resetCamera() {
      isPaused = false;
      xiongGe.style.display = 'block';
      document.getElementById('shootBtn').style.display = 'block';
      document.getElementById('retryBtn').style.display = 'none';
      document.getElementById('downloadBtn').style.display = 'none';
    }

    // 保存照片
    function downloadPhoto() {
      const link = document.createElement('a');
      link.download = '萬聖節變身合照.png';
      link.href = canvasElement.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
